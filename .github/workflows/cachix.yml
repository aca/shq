name: cachix

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: kata
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # push only the final package closure, not build-time deps
          skipPush: true
      - run: nix build -L .#default
      - run: cachix push kata ./result
